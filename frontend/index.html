<!doctype html>
<html lang="pt-BR" data-profile="catflix">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0A0F" />
    <title>Filmes</title>

    <!--
      PWA. Não é enfeite: no iOS o Safari só entrega Web Push quando o app está
      INSTALADO na tela de início (16.4+), e sem manifest não há como instalar.
      A Carol usa iPhone e é quem mais acompanha a fila de revisão (§3).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- o iOS não lê `icons` do manifest para a tela de início; usa esta -->
    <link rel="apple-touch-icon" href="/logo-256.png" />
    <!-- o padrão atual; o `apple-` abaixo continua porque o Safari antigo só lê ele -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Filmes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
